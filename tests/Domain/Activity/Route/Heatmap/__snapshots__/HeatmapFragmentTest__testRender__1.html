</nav>
    <div class="grid grid-cols-1 gap-y-2 heatmap-wrapper relative">

                                <span>Filter on sport type</span>
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewbox="0 0 10 6">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"></path>
                                </svg>
                            </button>
                            <div id="dropdownSportTypes" class="divide-y divide-gray-100">
                                <ul class="space-y-1" aria-labelledby="dropdownSportTypesButton">
                                                                            <li>
                                            <div>
                                                <input type="checkbox" id="Ride" data-datatable-filter="sportType" name="sportType[Ride]" value="Ride" class="peer">
                                                <label for="Ride" class="flex gap-x-1 items-center">

                                                <a href="#" data-datatable-filter-clear="sportType[Ride]">clear</a>
                                            </div>
                                        </li>
                                                                    </ul>
                            </div>
                        </div>
                                        <div class="filter-dropdown">
                        <button id="dropdownDateRangeButton" data-dropdown="dropdownDateRange" type="button">
                            <span>Date</span>

                            </svg>

                        </div>
                    </div>
                    <div class="filter-dropdown">

                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"></path>
                            </svg>

                                    <div class="text-xs font-medium items-center">Commutes</div>
                                    <ul class="text-sm text-gray-700">
                                        <li>
                                            <div>
                                                <input type="radio" id="true" data-datatable-filter="isCommute" name="isCommute" value="true" class="peer">

                                                    Commutes only
                                                </label>
                                                <a href="#" data-datatable-filter-clear="isCommute">clear</a>
                                            </div>
                                        </li>
                                        <li>
                                            <div>
                                                <input type="radio" id="false" data-datatable-filter="isCommute" name="isCommute" value="false" class="peer">

                                                    Excludes commutes
                                                </label>
                                                <a href="#" data-datatable-filter-clear="isCommute">clear</a>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <div class="flex flex-col items-center">
                                    <div class="text-xs font-medium">Workout type</div>
                                    <ul class="text-sm text-gray-700">
                                                                                    <li>
                                                <div>
                                                    <input type="radio" id="race" data-datatable-filter="workoutType" name="workoutType" value="race" class="peer">

                                                        Race
                                                    </label>
                                                    <a href="#" data-datatable-filter-clear="workoutType">clear</a>
                                                </div>
                                            </li>
                                                                                    <li>
                                                <div>
                                                    <input type="radio" id="workout" data-datatable-filter="workoutType" name="workoutType" value="workout" class="peer">
                                                    <label for="workout">
                                                        Workout
                                                    </label>
                                                    <a href="#" data-datatable-filter-clear="workoutType">clear</a>
                                                </div>
                                            </li>
                                                                                    <li>
                                                <div>
                                                    <input type="radio" id="longRun" data-datatable-filter="workoutType" name="workoutType" value="longRun" class="peer">

                                                        Long run
                                                    </label>
                                                    <a href="#" data-datatable-filter-clear="workoutType">clear</a>
                                                </div>
                                            </li>
                                                                            </ul>

                            </div>
                        </div>

                </div>

            <div class="flex items-center justify-between gap-x-2 text-xs text-gray-700">

                                        <span class="font-bold" data-datatable-result-count>1</span> routes

                <a href="#" class="hidden font-medium text-primary hover:underline" data-datatable-reset>Clear all filters</a>

        <div class="hidden lg:block z-10000 absolute bottom-3 left-3 py-2 px-4 bg-white border border-gray-200 rounded-lg shadow-xs text-xs">
