<!-- Modal header --><html><body>
<div class="modal-header">
  <div class="flex items-center justify-between">
    <h3>
      Virtual workout assistant
    </h3>
    <div class="flex items-center gap-1">
      <button type="button" class="cursor-pointer clear-chat text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm size-8 inline-flex justify-center items-center" title="Clear chat">
        <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewbox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        <span class="sr-only">Clear chat</span>
      </button>
      <button type="button" class="close">
        <svg class="size-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewbox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
  </div>
</div>
<!-- Modal body -->
<div class="modal-body">
  <div class="grid grid-cols-1">
    <div class="flex flex-col-reverse items-center border rounded-t bg-gray-50 h-[calc(100vh-15.4rem)] overflow-y-auto">
      <div class="chat--wrapper w-full flex flex-col gap-6 p-8" data-chat-commands="[]">
                    <div class="message-wrapper flex items-start gap-x-6 bg-white shadow-xs p-6 text-gray-500 rounded-md last:animate-fade-in-chat-message">
                        <div class="size-6 shrink-0 rounded-full border flex items-center justify-center bg-primary text-white text-xs p-1">
                R
            </div>
                <div class="message">
                    message
            </div>
</div>              </div>
    </div>
      <form name="form" method="post" action="/ai/chat/user-message" class="[&amp;.disabled]:bg-gray-100 flex gap-x-4 items-center border border-t-0 rounded-b text-gray-900 py-2 px-2">
        <div class="hidden">Message</div>
        <input required name="form[message]" id="form_message" value="" placeholder="Ask Mark something..." data-placeholder-idle="Ask Mark something..." data-placeholder-processing="Thinking..." class="message disabled:bg-gray-100 disabled:cursor-not-allowed border-0 w-full px-1 py-2.5 focus:ring-0 focus-visible:outline-0">

        <button type="submit" name="form[submit]" id="form_submit" class="send-message disabled:cursor-not-allowed cursor-pointer text-primary hover:bg-primary/30 disabled:hover:bg-white rounded-full text-sm p-2.5 inline-flex items-center">
            <svg class="size-4 rotate-90" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewbox="0 0 18 20">
                <path d="m17.914 18.594-8-18a1 1 0 0 0-1.828 0l-8 18a1 1 0 0 0 1.157 1.376L8 18.281V9a1 1 0 0 1 2 0v9.281l6.758 1.689a1 1 0 0 0 1.156-1.376Z"></path>
            </svg>
            <span class="sr-only">Send message</span>
        </button>
        <div role="status" class="spinner hidden p-2.5">
          <div class="loader loader--sm"></div>
          <span class="sr-only">Loading...</span>
        </div>
      <input type="hidden" id="form__token" name="form[_token]" data-controller="csrf-protection" class="" value="csrf-token">
</form>
  </div>
</div>
</body></html>
