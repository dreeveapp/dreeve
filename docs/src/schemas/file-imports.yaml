paths:
  upload:
    post:
      operationId: uploadActivityFile
      tags: [File imports]
      summary: Upload an activity file
      description: |
        Queues a `.fit`, `.tcx` or `.gpx` file for import.

        **The upload is asynchronous**: a success is `202 Accepted`, not `200 OK`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The activity file. Must be named `*.fit`, `*.tcx` or `*.gpx`.
      responses:
        '202':
          description: The file was queued for import.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    const: queued
                  message:
                    type: string
              examples:
                queued:
                  value:
                    status: queued
                    message: File queued for import.
        '400':
          description: No usable `file` part was sent.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                missingFile:
                  value: { error: missing_file, message: 'A "file" part is required.' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`, so it cannot accept uploaded files.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Activity files can only be uploaded when running in file import mode.
        '413':
          description: >-
            The file is larger than `upload_max_filesize`, or the whole request is larger than
            `post_max_size`.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                tooLarge:
                  value: { error: file_too_large, message: The uploaded file is too large. }
        '415':
          description: The body was not `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                notMultipart:
                  value:
                    error: unsupported_media_type
                    message: Send the file as multipart/form-data.
        '422':
          description: >-
            The filename is unusable. Either the extension is not one of `fit`, `tcx` or `gpx`, or
            the name itself contains control characters or invalid UTF-8.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongExtension:
                  value: { error: unsupported_file_type, message: The file type is not supported. }
        '500':
          description: The upload could not be stored.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                cannotStore:
                  value: { error: internal_error, message: The upload could not be stored. }
  list:
    get:
      operationId: listFileImports
      tags: [File imports]
      summary: Search file imports
      description: |
        Lists the files that are waiting to be imported, followed by the outcome of every file
        import, newest first.

        | Status    | Meaning                                                                     |
        |-----------|-----------------------------------------------------------------------------|
        | `queued`  | The file is waiting for the next import run.                                |
        | `success` | The file was imported; `activityId` is the new activity.                    |
        | `skipped` | The file duplicates an activity that was already imported.                  |
        | `failed`  | The file could not be imported; `errorMessage` says why.                    |

        ```
        GET /api/v1/file-imports?filters[filename]=morning-ride.fit
        ```
      parameters:
        - name: filters
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              filename:
                type: string
                description: >-
                  Only imports of the file with exactly this name
                examples: ['morning-ride.fit']
              status:
                type: string
                description: >-
                  One status, or several separated by commas. Queued files are always listed.
                examples: ['failed', 'skipped,failed']
              source:
                type: string
                description: >-
                  One source, or several separated by commas
                examples: ['fitFile', 'tcxFile,gpxFile']
        - name: pagination
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
                default: 1
              size:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
      responses:
        '200':
          description: A page of file imports, queued files first, then newest first.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/FileImportList' }
        '400':
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                unknownStatus:
                  value:
                    error: bad_request
                    message: '"filters[status]" contains an unknown status.'
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
  file:
    get:
      operationId: downloadFileImport
      tags: [File imports]
      summary: Download the original file
      description: >-
        Returns the file exactly as it was uploaded
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/FileImportId'
      responses:
        '200':
          description: The original `.fit`, `.tcx` or `.gpx` file.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename=morning-ride.fit']
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          description: The file import does not exist, or it has no stored file.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                unknownFileImport:
                  summary: No such file import
                  value: { error: not_found, message: 'File import "fileImport-1" not found' }
                withoutFile:
                  summary: A skipped duplicate
                  value:
                    error: file_not_available
                    message: 'File import "fileImport-0198a2b1-8f3e-7c2d-9a4b-1f2e3d4c5b6a" has no stored file.'

schemas:
  FileImportList:
    type: object
    required: [fileImports, pagination]
    properties:
      fileImports:
        type: array
        items: { $ref: './dreeve-api.yaml#/components/schemas/FileImport' }
      pagination: { $ref: './dreeve-api.yaml#/components/schemas/PaginationMeta' }
  FileImport:
    type: object
    required: [id, filename, source, status, errorMessage, activityId, importedOn]
    properties:
      id:
        type: [string, 'null']
        description: Null while the file is queued.
        examples: ['fileImport-0198a2b1-8f3e-7c2d-9a4b-1f2e3d4c5b6a']
      filename:
        type: string
        examples: ['morning-ride.fit']
      source:
        type: string
        enum: [fitFile, tcxFile, gpxFile]
      status:
        type: string
        enum: [queued, success, skipped, failed]
      errorMessage:
        type: [string, 'null']
        examples: ['Skipped, activity was already imported']
      activityId:
        type: [string, 'null']
        description: The imported activity. Only set when the status is `success`.
        examples: ['activity-9542782314']
      importedOn:
        type: [string, 'null']
        format: date-time
        description: Null while the file is queued.
        examples: ['2026-09-28T10:00:00']
