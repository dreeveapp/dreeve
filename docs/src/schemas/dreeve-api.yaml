openapi: 3.1.0
info:
  title: Dreeve HTTP API
  version: v1
  summary: The public HTTP API of a self-hosted Dreeve instance.
  description: |
    Every endpoint is authenticated with a bearer token and returns JSON. Errors always use the
    same shape, with a stable `error` code to branch on and a human readable `message`.

    ## Enabling the API

    The API is closed until `DREEVE_API_KEY` is set. Generate a key in the admin panel under
    **Settings → Security → API access**, put it in your `.env` file, and recreate your containers

    Only a key generated by Dreeve is accepted; it looks like `drv_` followed by 64 hex characters.
    To revoke a key, delete the line and recreate the containers again.

    `GET /api/v1/status` is the cheapest way to check that a URL and key are correct.

servers:
  - url: '{appUrl}'
    description: Your Dreeve instance.
    variables:
      appUrl:
        default: http://localhost:8080
        description: The value you configured as APP_URL
security:
  - apiKey: []
tags:
  - name: Status
  - name: Activities
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [Status]
      summary: Check the connection
      responses:
        '200':
          description: The key is valid.
          content:
            application/json:
              schema:
                type: object
                required: [app, version, canUpload]
                properties:
                  app:
                    type: string
                    const: dreeve
                  version:
                    type: string
                    description: The running Dreeve version.
                    examples: ['v5.2.3']
                  canUpload:
                    type: boolean
                    description: >-
                      Whether this instance accepts uploads. False when `IMPORT_MODE` is not
                      `files`, in which case every upload answers 409.
              examples:
                filesMode:
                  summary: Ready to accept uploads
                  value: { app: dreeve, version: v5.2.3, canUpload: true }
                stravaApiMode:
                  summary: Valid key, but uploads are disabled
                  value: { app: dreeve, version: v5.2.3, canUpload: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/activity/upload:
    post:
      operationId: uploadActivityFile
      tags: [Activities]
      summary: Upload an activity file
      description: |
        Queues a `.fit`, `.tcx` or `.gpx` file for import.

        **The upload is asynchronous**: a success is `202 Accepted`, not `200 OK`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The activity file. Must be named `*.fit`, `*.tcx` or `*.gpx`.
      responses:
        '202':
          description: The file was queued for import.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    const: queued
                  message:
                    type: string
              examples:
                queued:
                  value:
                    status: queued
                    message: File queued for import.
        '400':
          description: No usable `file` part was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missingFile:
                  value: { error: missing_file, message: 'A "file" part is required.' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`, so it cannot accept uploaded files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Activity files can only be uploaded when running in file import mode.
        '413':
          description: >-
            The file is larger than `upload_max_filesize`, or the whole request is larger than
            `post_max_size`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLarge:
                  value: { error: file_too_large, message: The uploaded file is too large. }
        '415':
          description: The body was not `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notMultipart:
                  value:
                    error: unsupported_media_type
                    message: Send the file as multipart/form-data.
        '422':
          description: >-
            The filename is unusable. Either the extension is not one of `fit`, `tcx` or `gpx`, or
            the name itself contains control characters or invalid UTF-8.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                wrongExtension:
                  value: { error: unsupported_file_type, message: The file type is not supported. }
        '500':
          description: The upload could not be stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                cannotStore:
                  value: { error: internal_error, message: The upload could not be stored. }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        Send your key as `Authorization: Bearer drv_...`
  schemas:
    Error:
      type: object
      required: [error, message]
      description: Every error uses this shape.
      properties:
        error:
          type: string
          description: >-
            A stable, machine readable code.
          enum:
            - invalid_token
            - missing_file
            - unsupported_media_type
            - unsupported_file_type
            - file_too_large
            - import_mode_not_files
            - not_found
            - method_not_allowed
            - bad_request
            - forbidden
            - internal_error
        message:
          type: string
  responses:
    Unauthorized:
      description: >-
        The `Authorization` header was missing, malformed, or did not match the configured key.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="Dreeve"']
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidToken:
              value:
                error: invalid_token
                message: A valid API token is required. Send it in the Authorization header as a Bearer token.
