openapi: 3.1.0
info:
  title: Dreeve HTTP API
  version: v1
  summary: The public HTTP API of a self-hosted Dreeve instance.
  description: |
    Every endpoint is authenticated with a bearer token and returns JSON. Errors always use the
    same shape, with a stable `error` code to branch on and a human readable `message`.

    The raw OpenAPI document is available at [/api/openapi.yaml](/api/openapi.yaml), for use with
    code generators, API clients and AI assistants.

    ## Enabling the API

    The API is closed until `DREEVE_API_KEY` is set. Generate a key in the admin panel under
    **Settings → Security → API access**, put it in your `.env` file, and recreate your containers

    Only a key generated by Dreeve is accepted; it looks like `drv_` followed by 64 hex characters.
    To revoke a key, delete the line and recreate the containers again.

    `GET /api/v1/status` is the cheapest way to check that a URL and key are correct.

servers:
  - url: '{appUrl}'
    description: Your Dreeve instance.
    variables:
      appUrl:
        default: http://localhost:8080
        description: The value you configured as APP_URL
security:
  - apiKey: []
tags:
  - name: Status
  - name: Activities
  - name: Activity images
  - name: File imports
  - name: Gear
  - name: Weight
  - name: Metrics
paths:
  /api/v1/status: { $ref: './status.yaml#/paths/status' }
  /api/v1/activity/upload: { $ref: './file-imports.yaml#/paths/upload' }
  /api/v1/activities: { $ref: './activities.yaml#/paths/list' }
  /api/v1/activities/{activityId}: { $ref: './activities.yaml#/paths/detail' }
  /api/v1/activities/{activityId}/gpx: { $ref: './activities.yaml#/paths/gpx' }
  /api/v1/activities/{activityId}/streams: { $ref: './activities.yaml#/paths/streams' }
  /api/v1/activities/{activityId}/images: { $ref: './activity-images.yaml#/paths/list' }
  /api/v1/activities/{activityId}/images/{imageId}: { $ref: './activity-images.yaml#/paths/detail' }
  /api/v1/file-imports: { $ref: './file-imports.yaml#/paths/list' }
  /api/v1/gear: { $ref: './gear.yaml#/paths/list' }
  /api/v1/gear/maintenance-tasks: { $ref: './gear.yaml#/paths/maintenanceTasks' }
  /api/v1/athlete/weights: { $ref: './weight.yaml#/paths/list' }
  /api/v1/athlete/weights/{on}: { $ref: './weight.yaml#/paths/detail' }
  /api/v1/metrics/training-load: { $ref: './metrics.yaml#/paths/trainingLoad' }
  /api/v1/metrics/training-volume: { $ref: './metrics.yaml#/paths/trainingVolume' }
  /api/v1/metrics/streaks: { $ref: './metrics.yaml#/paths/streaks' }
  /api/v1/metrics/eddington: { $ref: './metrics.yaml#/paths/eddington' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        Send your key as `Authorization: Bearer drv_...`
  schemas:
    ActivityList: { $ref: './activities.yaml#/schemas/ActivityList' }
    FileImportList: { $ref: './file-imports.yaml#/schemas/FileImportList' }
    FileImport: { $ref: './file-imports.yaml#/schemas/FileImport' }
    Gear: { $ref: './gear.yaml#/schemas/Gear' }
    MaintenanceTask: { $ref: './gear.yaml#/schemas/MaintenanceTask' }
    PaginationMeta: { $ref: './common.yaml#/schemas/PaginationMeta' }
    Activity: { $ref: './activities.yaml#/schemas/Activity' }
    ActivityImage: { $ref: './activity-images.yaml#/schemas/ActivityImage' }
    ActivityLocation: { $ref: './activities.yaml#/schemas/ActivityLocation' }
    ActivityStreams: { $ref: './activities.yaml#/schemas/ActivityStreams' }
    WeightHistory: { $ref: './weight.yaml#/schemas/WeightHistory' }
    WeightMeasurement: { $ref: './weight.yaml#/schemas/WeightMeasurement' }
    WeightRecorded: { $ref: './weight.yaml#/schemas/WeightRecorded' }
    TrainingLoad: { $ref: './metrics.yaml#/schemas/TrainingLoad' }
    TrainingVolume: { $ref: './metrics.yaml#/schemas/TrainingVolume' }
    Streaks: { $ref: './metrics.yaml#/schemas/Streaks' }
    Streak: { $ref: './metrics.yaml#/schemas/Streak' }
    LongestBreak: { $ref: './metrics.yaml#/schemas/LongestBreak' }
    Eddington: { $ref: './metrics.yaml#/schemas/Eddington' }
    Error: { $ref: './common.yaml#/schemas/Error' }
  parameters:
    ActivityId: { $ref: './common.yaml#/parameters/ActivityId' }
    ActivityImageId: { $ref: './common.yaml#/parameters/ActivityImageId' }
  responses:
    ActivityNotFound: { $ref: './common.yaml#/responses/ActivityNotFound' }
    Unauthorized: { $ref: './common.yaml#/responses/Unauthorized' }
