paths:
  list:
    get:
      operationId: listActivities
      tags: [Activities]
      summary: Search activities
      description: |
        Returns activities newest first. All filters are optional

        ```
        GET /api/v1/activities?filters[from]=2023-09-04&filters[to]=2023-09-04&pagination[size]=50
        ```
      parameters:
        - name: filters
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              from:
                type: string
                format: date
                description: >-
                  Only activities that started on this day or later
                examples: ['2023-09-04']
              to:
                type: string
                format: date
                description: >-
                  Only activities that started on this day or earlier
                examples: ['2023-09-11']
              sportType:
                type: string
                description: >-
                  One sport type, or several separated by commas
                examples: ['Ride', 'Run,TrailRun,Hike']
              hasGpx:
                type: string
                enum: ['true', 'false']
        - name: pagination
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
                default: 1
              size:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
      responses:
        '200':
          description: A page of activities, newest first.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/ActivityList' }
        '400':
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                unknownSportType:
                  value:
                    error: bad_request
                    message: '"filters[sportType]" contains an unknown sport type.'
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
  detail:
    get:
      operationId: getActivity
      tags: [Activities]
      summary: Get one activity
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Activity' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './dreeve-api.yaml#/components/responses/ActivityNotFound'
    patch:
      operationId: updateActivity
      tags: [Activities]
      summary: Update an activity
      description: >-
        Changes the name, sport type, description or gear of an activity.
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  examples: ['Evening ride']
                sportType:
                  type: string
                  examples: ['GravelRide']
                description:
                  type: [string, 'null']
                  description: Send `null` or an empty string to clear the description.
                  examples: ['Rerouted around the closed bridge']
                gearId:
                  type: [string, 'null']
                  description: The prefixed id of existing gear. Send `null` or an empty string to remove the gear.
                  examples: ['gear-b12659861']
      responses:
        '200':
          description: The updated activity.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Activity' }
        '400':
          description: The JSON body is invalid, empty, or contains an unknown field or value.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                invalidSportType:
                  value: { error: bad_request, message: 'A valid "sportType" is required.' }
                unknownGear:
                  value: { error: bad_request, message: 'Gear "gear-b12659861" not found.' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './dreeve-api.yaml#/components/responses/ActivityNotFound'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Activities can only be updated when running in file import mode.
    delete:
      operationId: deleteActivity
      tags: [Activities]
      summary: Delete an activity
      description: >-
        Deletes the activity together with its streams, laps, splits, best efforts and import log.
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      responses:
        '204':
          description: The activity was deleted.
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './dreeve-api.yaml#/components/responses/ActivityNotFound'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Activities can only be deleted when running in file import mode.
  gpx:
    get:
      operationId: getActivityGpx
      tags: [Activities]
      summary: Download as GPX
      description: >-
        Only activities recorded with GPS data can be exported. Check `hasGpx` on the activity
        first
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      responses:
        '200':
          description: The route as a GPX 1.1 document.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename=2023-09-04-evening-ride.gpx']
          content:
            application/gpx+xml:
              schema:
                type: string
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          description: The activity does not exist, or it exists but has no GPS data.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                unknownActivity:
                  summary: No such activity
                  value: { error: not_found, message: 'Activity "activity-1" not found' }
                withoutGps:
                  summary: A manual or indoor activity
                  value:
                    error: gpx_not_available
                    message: 'Activity "activity-9542782314" has no GPS or time data to export as GPX.'
  streams:
    get:
      operationId: getActivityStreams
      tags: [Activities]
      summary: Get activity streams
      description: >-
        Returns the streams of an activity: its time-series data, one array per metric. The
        arrays line up by index, so the n-th value of every stream belongs to the same moment
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      responses:
        '200':
          description: The streams of the activity.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/ActivityStreams' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './dreeve-api.yaml#/components/responses/ActivityNotFound'

schemas:
  ActivityList:
    type: object
    required: [activities, pagination]
    properties:
      activities:
        type: array
        items: { $ref: './dreeve-api.yaml#/components/schemas/Activity' }
      pagination: { $ref: './dreeve-api.yaml#/components/schemas/PaginationMeta' }
  Activity:
    type: object
    required:
      - id
      - name
      - description
      - sportType
      - worldType
      - importSource
      - startDateLocal
      - distanceInMeter
      - elevationInMeter
      - movingTimeInSeconds
      - elapsedTimeInSeconds
      - averageSpeedInKmPerHour
      - maxSpeedInKmPerHour
      - isCommute
      - location
      - passedThroughCountries
      - hasGpx
      - images
    properties:
      id:
        type: string
        examples: ['activity-9756441741']
      name:
        type: string
        examples: ['Evening Ride']
      description:
        type: string
      sportType:
        type: string
        description: Strava's sport type vocabulary.
        examples: ['Ride', 'TrailRun', 'Hike']
      workoutType:
        type: [string, 'null']
      worldType:
        type: string
        examples: ['realWorld', 'zwift']
      importSource:
        type: string
        examples: ['stravaApi', 'file', 'manual']
      startDateLocal:
        type: string
        examples: ['2023-09-04T21:05:38']
      distanceInMeter:
        type: integer
      elevationInMeter:
        type: integer
      movingTimeInSeconds:
        type: integer
      elapsedTimeInSeconds:
        type: integer
      averageSpeedInKmPerHour:
        type: number
      maxSpeedInKmPerHour:
        type: number
      calories:
        type: [integer, 'null']
      kilojoules:
        type: [integer, 'null']
      averageHeartRate:
        type: [integer, 'null']
      maxHeartRate:
        type: [integer, 'null']
      averagePower:
        type: [integer, 'null']
      maxPower:
        type: [integer, 'null']
      averageCadence:
        type: [integer, 'null']
      isCommute:
        type: boolean
      deviceName:
        type: [string, 'null']
      gearId:
        type: [string, 'null']
        examples: ['gear-b12659861']
      location: { $ref: './dreeve-api.yaml#/components/schemas/ActivityLocation' }
      passedThroughCountries:
        type: array
        description: Lowercased ISO 3166-1 alpha-2 codes, empty when not reverse geocoded.
        items:
          type: string
        examples: [['be', 'nl']]
      startLatLng:
        type: [array, 'null']
        description: The starting point as `[latitude, longitude]`, null without GPS data.
        minItems: 2
        maxItems: 2
        items:
          type: number
        examples: [[51.2, 3.18]]
      encodedPolyline:
        type: [string, 'null']
      hasGpx:
        type: boolean
        description: >-
          Whether `GET /api/v1/activities/{activityId}/gpx` will return a file for this activity.
      images:
        type: array
        items: { $ref: './dreeve-api.yaml#/components/schemas/ActivityImage' }
  ActivityLocation:
    type: object
    required: [countryCode, state, city]
    properties:
      countryCode:
        type: [string, 'null']
        description: Lowercased ISO 3166-1 alpha-2.
        examples: ['be']
      state:
        type: [string, 'null']
        examples: ['West-Vlaanderen']
      city:
        type: [string, 'null']
        examples: ['Brugge']
  ActivityStreams:
    type: object
    required:
      - timeInSeconds
      - distanceInMeter
      - latLng
      - altitudeInMeter
      - velocityInMeterPerSecond
      - heartRate
      - cadence
      - powerInWatts
      - temperatureInCelsius
      - moving
      - gradeInPercent
    properties:
      timeInSeconds:
        type: [array, 'null']
        description: Seconds since the start of the activity.
        items:
          type: integer
        examples: [[0, 1, 2]]
      distanceInMeter:
        type: [array, 'null']
        description: Distance covered since the start, in meters.
        items:
          type: number
        examples: [[0, 4.1, 8.3]]
      latLng:
        type: [array, 'null']
        description: '`[latitude, longitude]` pairs. A point without a GPS fix is `null`.'
        items:
          type: [array, 'null']
          minItems: 2
          maxItems: 2
          items:
            type: number
        examples: [[[51.2, 3.18], [51.2001, 3.1802]]]
      altitudeInMeter:
        type: [array, 'null']
        items:
          type: number
        examples: [[10.5, 11.0, 11.5]]
      velocityInMeterPerSecond:
        type: [array, 'null']
        items:
          type: number
        examples: [[8.1, 8.3, 8.2]]
      heartRate:
        type: [array, 'null']
        description: Beats per minute.
        items:
          type: integer
        examples: [[120, 121, 122]]
      cadence:
        type: [array, 'null']
        description: Revolutions or steps per minute.
        items:
          type: integer
        examples: [[80, 81, 82]]
      powerInWatts:
        type: [array, 'null']
        items:
          type: integer
        examples: [[200, 210, 220]]
      temperatureInCelsius:
        type: [array, 'null']
        items:
          type: number
        examples: [[20, 20, 21]]
      moving:
        type: [array, 'null']
        description: Whether the athlete was moving at that moment.
        items:
          type: boolean
        examples: [[true, true, false]]
      gradeInPercent:
        type: [array, 'null']
        items:
          type: number
        examples: [[0.5, 1.2, 1.1]]
