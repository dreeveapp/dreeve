paths:
  list:
    post:
      operationId: addActivityImage
      tags: [Activity images]
      summary: Add an image
      description: >-
        Stores the image and appends it to the activity's `images`.
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    A jpg, png or webp image.
      responses:
        '201':
          description: The image was added to the activity.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/ActivityImage' }
        '400':
          description: No usable `file` part was sent.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                missingFile:
                  value: { error: missing_file, message: 'A "file" part is required.' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './dreeve-api.yaml#/components/responses/ActivityNotFound'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Images can only be added to activities when running in file import mode.
        '413':
          description: >-
            The file is larger than `upload_max_filesize`, or the whole request is larger than
            `post_max_size`.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                tooLarge:
                  value: { error: file_too_large, message: The uploaded file is too large. }
        '415':
          description: The body was not `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                notMultipart:
                  value:
                    error: unsupported_media_type
                    message: Send the file as multipart/form-data.
        '422':
          description: The file is not a jpg, png or webp image.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                notAnImage:
                  value:
                    error: unsupported_file_type
                    message: The file is not a jpg, png or webp image.
        '500':
          description: The upload could not be stored.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                cannotStore:
                  value: { error: internal_error, message: The upload could not be stored. }
  detail:
    delete:
      operationId: removeActivityImage
      tags: [Activity images]
      summary: Remove an image
      description: Removes the image from the activity and deletes the file.
      parameters:
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityId'
        - $ref: './dreeve-api.yaml#/components/parameters/ActivityImageId'
      responses:
        '204':
          description: The image was removed.
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '404':
          description: The activity does not exist, or the image is not one of its images.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                unknownActivity:
                  summary: No such activity
                  value: { error: not_found, message: 'Activity "activity-1" not found' }
                unknownImage:
                  summary: No such image on this activity
                  value:
                    error: not_found
                    message: 'Image "activityImage-0a8cdfbb-63b4-4f0f-a09d-faedd5a00753" not found'
        '409':
          description: >-
            This instance runs with `IMPORT_MODE=stravaApi`
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
              examples:
                wrongImportMode:
                  value:
                    error: import_mode_not_files
                    message: Images can only be removed from activities when running in file import mode.

schemas:
  ActivityImage:
    type: object
    required: [id, url]
    properties:
      id:
        type: string
        examples: ['activityImage-0a8cdfbb-63b4-4f0f-a09d-faedd5a00753']
      url:
        type: string
        format: uri
        description: >-
          Where the image is served. With demo mode enabled, visitors who are not logged in get a
          placeholder photo instead.
        examples: ['https://dreeve.example.com/files/activities/0a8cdfbb-63b4-4f0f-a09d-faedd5a00753.jpg']
