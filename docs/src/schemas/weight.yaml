paths:
  list:
    get:
      operationId: listAthleteWeights
      tags: [Weight]
      summary: List weight measurements
      responses:
        '200':
          description: Weight measurements, ordered from newest to oldest, always returned as a single page.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/WeightHistory' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
    post:
      operationId: recordAthleteWeight
      tags: [Weight]
      summary: Record a weight measurement
      description: >-
        Creates a weight measurement for a calendar date, or replaces the existing measurement for
        that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight, on]
              properties:
                weight:
                  type: number
                  exclusiveMinimum: 0
                  description: >-
                    The measurement in the configured Appearance unit system: kilograms for Metric
                    and pounds for Imperial.
                  examples: [71.4]
                on:
                  type: string
                  format: date
                  description: The measurement date as `YYYY-MM-DD`.
                  examples: ['2026-09-08']
      responses:
        '200':
          description: The measurement for the date was recorded.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/WeightRecorded' }
        '400':
          description: The JSON body, date, or weight is invalid.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'
        '415':
          description: The body was not `application/json`.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
  detail:
    delete:
      operationId: deleteAthleteWeight
      tags: [Weight]
      summary: Delete a weight measurement
      parameters:
        - name: on
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '204':
          description: The measurement was deleted, if one existed for the date.
        '400':
          description: The date is invalid.
          content:
            application/json:
              schema: { $ref: './dreeve-api.yaml#/components/schemas/Error' }
        '401':
          $ref: './dreeve-api.yaml#/components/responses/Unauthorized'

schemas:
  WeightHistory:
    type: object
    required: [weights, pagination]
    properties:
      weights:
        type: array
        items: { $ref: './dreeve-api.yaml#/components/schemas/WeightMeasurement' }
      pagination: { $ref: './dreeve-api.yaml#/components/schemas/PaginationMeta' }
  WeightMeasurement:
    type: object
    required: [on, weight]
    properties:
      on:
        type: string
        format: date
      weight:
        type: number
        description: >-
          The measurement in the configured Appearance unit system: kilograms for Metric and
          pounds for Imperial.
  WeightRecorded:
    type: object
    required: [on, weight]
    properties:
      on:
        type: string
        format: date
      weight:
        type: number
        description: >-
          The measurement in the configured Appearance unit system: kilograms for Metric and
          pounds for Imperial.
