name: ci
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: Run CI
    runs-on: ubuntu-24.04
    env:
      PHP: docker compose run --rm -e XDEBUG_MODE=coverage php-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI environment
        uses: ./.github/actions/setup-docker-env

      - name: Validate composer.json
        run: $PHP composer validate --strict

      - name: Validate PSR-4 compliance
        run: $PHP composer dump-autoload --dev --optimize --strict-psr

      - name: Run PHPStan
        run: $PHP vendor/bin/phpstan analyse

      - name: Run Rector
        run: $PHP vendor/bin/rector --dry-run

      - name: Run PHPcs fixer dry-run
        run: $PHP vendor/bin/php-cs-fixer fix --dry-run --stop-on-violation --config=.php-cs-fixer.dist.php

      - name: Run test suite
        run: $PHP vendor/bin/paratest --order-by=random --fail-on-incomplete --log-junit junit.xml --coverage-clover=clover.xml

      - name: Run Caddy test suite
        run: $PHP vendor/bin/paratest --testsuite caddy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: dreeveapp/dreeve
          files: clover.xml
          fail_ci_if_error: false
