name: Publish Docker image
on:
  workflow_dispatch:
    inputs:
      registries:
        description: 'Registries to publish to'
        type: choice
        default: both
        options:
          - both
          - ghcr
  push:
    tags:
      - 'v*'
jobs:
  push_to_registries:
    name: Push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zstd

      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install dependencies
        run: composer install --prefer-dist --no-scripts --no-dev

      - name: Verify app version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          touch .env
          bin/console app:release:verify-version "$TAG"

      - name: Compress Symfony Intl data
        run: composer run compress-intl

      - name: Build countries geography asset
        run: |
          touch .env
          bin/console app:geography:build-countries-asset

      - name: Verify countries geography asset
        run: |
          ASSET_ROOT=resources
          ASSET_DIR="$ASSET_ROOT/countries"

          if [[ ! -f "$ASSET_DIR/index.json.zst" ]]; then
            echo "::error::$ASSET_DIR/index.json.zst is missing, refusing to build an image without country boundaries"
            exit 1
          fi

          ENTRIES=$(zstd -dc "$ASSET_DIR/index.json.zst" | jq 'length')
          COUNTRIES=$(find "$ASSET_DIR" -name '*.json.zst' -not -name 'index.json.zst' | wc -l)

          if (( ENTRIES < 4000 )); then
            echo "::error::index.json.zst holds only $ENTRIES polygons, expected 4000+"
            exit 1
          fi
          if (( COUNTRIES < 200 )); then
            echo "::error::Only $COUNTRIES country files were generated, expected 200+"
            exit 1
          fi

          UNREADABLE=$(find "$ASSET_ROOT" \( -type d ! -perm -o+rx \) -o \( -type f ! -perm -o+r \))
          if [[ -n "$UNREADABLE" ]]; then
            echo "::error::These asset paths are not readable, which breaks non-root deployments:"
            echo "$UNREADABLE"
            exit 1
          fi

          echo "$COUNTRIES country files, $ENTRIES polygons indexed"

      - name: Log in to Docker Hub
        if: ${{ inputs.registries != 'ghcr' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.registries != 'ghcr' && 'robiningelbrecht/dreeve' || '' }}
            ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          file: docker/app/Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation for Docker Hub
        if: ${{ inputs.registries != 'ghcr' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/robiningelbrecht/dreeve
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Generate artifact attestation for GHCR
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false