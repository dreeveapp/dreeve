version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/Brussels'
    assignees:
      - "robiningelbrecht"
    labels:
      - "tech debt"
    ignore:
      - dependency-name: '*'
        update-types:
          ['version-update:semver-patch', 'version-update:semver-minor']
  - package-ecosystem: 'composer'
    directory: '/'
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Europe/Brussels'
    assignees:
      - "robiningelbrecht"
    labels:
      - "tech debt"
    groups:
      composer:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'symfony/*'
        versions:
          - '>=8.2'
