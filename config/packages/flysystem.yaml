# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            local:
                directory: '%kernel.project_dir%'
        file.storage:
            local:
                directory: '%kernel.project_dir%/storage/files'
        countries-geography.storage:
            local:
                directory: '%kernel.project_dir%/resources/countries'
            visibility: public
            directory_visibility: public
        database.storage:
            local:
                directory: '%kernel.project_dir%/storage/database'
        build.storage:
            local:
                directory: '%kernel.project_dir%/build'
