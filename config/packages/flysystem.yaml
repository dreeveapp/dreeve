# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%'
                lock: 0
        file.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/storage/files'
                lock: 0
        countries-geography.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/src/Domain/Activity/Route/assets/countries'
                lock: 0
            visibility: public
            directory_visibility: public
        database.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/storage/database'
                lock: 0
        build-html.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/build/html'
                lock: 0
        build_api.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/build/api'
                lock: 0