# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    session: true
    # Without this, Dreeve can't tell requests came in over HTTPS from a reverse proxy,
    # so it generates http:// redirects (e.g. the /admin login redirect) even behind TLS.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
    assets:
        version_strategy: 'App\Infrastructure\Http\UuidAssetVersioningStrategy'

when@dev:
    framework:
        profiler:
            collect_serializer_data: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
