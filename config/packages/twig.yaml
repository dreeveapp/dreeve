twig:
    file_name_pattern: '*.twig'
    default_path: '%kernel.project_dir%/templates'
    strict_variables: false
    cache: true
    form_themes: ['form/flowbite-layout.html.twig']
    globals:
        appName: '@App\Application\AppName'
        rebuildStatus: '@App\Application\RebuildStatus'
        activityPageBuildStatus: '@App\Application\Build\ActivityPageBuildStatus'
        appVersion: '@App\Application\AppVersion'
        importMode: '@App\Domain\Import\ImportMode'
        enrichedActivities: '@App\Domain\Activity\EnrichedActivities'
